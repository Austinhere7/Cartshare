<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartShare Receipt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/receipt.css">

</head>

<body>

<div class="container py-5">

    <div class="card shadow mx-auto" style="max-width:700px;">

        <div class="card-body">

            <h2 class="text-center mb-4">
                🛒 CartShare Receipt
            </h2>

            <p>
                <strong>Room Code:</strong>
                <span id="receiptRoom"></span>
            </p>

            <p>
                <strong>Host:</strong>
                <span id="receiptHost"></span>
            </p>

            <p>
    <strong>Date:</strong>
    <span id="receiptDate"></span>
</p>

<p>
    <strong>Total Items:</strong>
    <span id="totalItems"></span>
</p>

<p>
    <strong>Total Members:</strong>
    <span id="totalMembers"></span>
</p>

            <hr>

            <table class="table">

                <thead>

                    <tr>

                        <th>Item</th>

                        <th>Qty</th>

                        <th>Price</th>

                        <th>Total</th>

                    </tr>

                </thead>

                <tbody id="receiptItems">

                </tbody>

            </table>

            <h4 class="text-end">

                Grand Total:
                <span id="receiptTotal"></span>

            </h4>

            <hr>

            <h5>

                Members

            </h5>

            <ul id="receiptMembers">

            </ul>

            <div class="text-center mt-4">

                <hr>

<div class="text-center text-muted mt-4">

    <small>

        Thank you for using <strong>CartShare</strong> ❤️

        <br>

        This receipt was generated electronically.

    </small>

</div>

                <button
                    class="btn btn-success"
                    onclick="window.print()">

                    🖨 Print Receipt

                </button>

            </div>

        </div>

    </div>

</div>

<script src="../js/receipt.js"></script>

</body>

</html>
