<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartShare | Shopping Room</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/room.css">

</head>

<body>

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-5">

        <h2 class="fw-bold text-primary mb-3 mb-md-0">
            <i class="bi bi-cart3"></i>
            CartShare
        </h2>

        <span class="badge bg-success fs-6 px-3 py-2">
            <i class="bi bi-wifi"></i>
            Connected
        </span>

    </div>

    <div class="card border-0 shadow-card mb-4 bg-primary text-white">

    <div class="card-body py-4">

        <h3 class="fw-bold mb-2">
            Welcome to your Shopping Room 👋
        </h3>

        <p class="mb-0">
            Collaborate with your friends, manage shopping items together, and keep everything synchronized in real time.
        </p>

    </div>

</div>

    <!-- Room Details -->
    <div class="card shadow-card border-0 mb-4">

        <div class="card-body p-4">

            <h4 class="fw-bold mb-3">
                <i class="bi bi-house-door-fill text-primary"></i>
                Room Details
            </h4>

            <h5 id="roomTitle" class="fw-bold mb-3"></h5>

            <p id="roomCodeDisplay" class="mb-2 text-secondary"></p>

            <p id="hostDisplay" class="mb-0 text-secondary"></p>

        </div>

    </div>

    <div class="row g-4">

        <!-- Members -->
        <div class="col-lg-4">

            <div class="card shadow-card border-0 h-100">

                <div class="card-body p-4">

                    <h4 class="fw-bold mb-3">
                        <i class="bi bi-people-fill text-primary"></i>
                        Members
                    </h4>

                    <ul
                        id="memberList"
                        class="list-group list-group-flush">
                    </ul>

                </div>

            </div>

        </div>

        <!-- Right Column -->
        <div class="col-lg-8">

            <!-- Add Shopping Item -->
            <div class="card shadow-card border-0 mb-4">

                <div class="card-body p-4">

                    <h4 class="fw-bold mb-4">
                        <i class="bi bi-plus-circle-fill text-success"></i>
                        Add Shopping Item
                    </h4>

                    <div class="row g-3">

                        <div class="col-md-5">

                            <input
                                type="text"
                                id="itemName"
                                class="form-control"
                                placeholder="Item Name">

                        </div>

                        <div class="col-md-3">

                            <input
                                type="number"
                                id="itemQuantity"
                                class="form-control"
                                placeholder="Quantity">

                        </div>

                        <div class="col-md-2">

                            <input
                                type="number"
                                id="itemPrice"
                                class="form-control"
                                placeholder="Price">

                        </div>

                        <div class="col-md-2">

                            <button
                                id="addItemBtn"
                                class="btn btn-primary w-100">

                                <i class="bi bi-plus-lg"></i>
                                Add

                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Shopping Cart -->
            <div class="card shadow-card border-0 mb-4">

                <div class="card-body p-4">

                    <h4 class="fw-bold mb-4">
                        <i class="bi bi-cart-fill text-success"></i>
                        Shopping Cart
                    </h4>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>

                                <tr>

                                    <th>Item</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                    <th></th>

                                </tr>

                            </thead>

                            <tbody id="cartItems"></tbody>

                        </table>

                    </div>

                    <h4 class="fw-bold text-end mt-4 text-success">

                        Grand Total :
                        <span id="grandTotal">₹0</span>

                    </h4>

                    <div class="d-flex flex-wrap justify-content-end gap-3 mt-4">

                        <button
                            id="emptyCartBtn"
                            class="btn btn-danger">

                            <i class="bi bi-trash3-fill"></i>
                            Empty Cart

                        </button>

                        <button
                            id="receiptBtn"
                            class="btn btn-success">

                            <i class="bi bi-receipt"></i>
                            View Receipt

                        </button>

                    </div>

                </div>

            </div>

            <!-- Activity Log -->
            <div class="card shadow-card border-0">

                <div class="card-body p-4">

                    <h4 class="fw-bold mb-4">

                        <i class="bi bi-clock-history text-warning"></i>
                        Activity Timeline

                    </h4>

                    <div
                        id="activityLog"
                        class="d-flex flex-column gap-2">

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="../js/room.js"></script>

</body>

</html>
