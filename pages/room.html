<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CartShare | Shopping Room</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/room.css">
</head>

<body>

<div class="container py-5">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-5">

        <h2 class="fw-bold text-primary">
            <i class="bi bi-cart3"></i>
            CartShare
        </h2>

        <span class="badge bg-success fs-6">
            Connected
        </span>

    </div>

    <!-- Room Details -->
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <h3 id="roomTitle"></h3>

            <p id="roomCodeDisplay" class="mb-2"></p>

            <p id="hostDisplay" class="mb-0"></p>

        </div>

    </div>

    <div class="row g-4">

        <!-- Members -->
        <div class="col-lg-4">

            <div class="card shadow-sm border-0 mb-4">

                <div class="card-body">

                    <h5 class="mb-3">
                        <i class="bi bi-people-fill"></i>
                        Members
                    </h5>

                    <ul id="memberList" class="list-group"></ul>

                </div>

            </div>

        </div>

        <!-- Right Column -->
        <div class="col-lg-8">

            <!-- Add Shopping Item -->
            <div class="card shadow-sm border-0 mb-4">

                <div class="card-body">

                    <h5 class="mb-4">Add Shopping Item</h5>

                    <div class="row g-3">

                        <div class="col-md-5">
                            <input type="text" id="itemName" class="form-control" placeholder="Item Name">
                        </div>

                        <div class="col-md-3">
                            <input type="number" id="itemQuantity" class="form-control" placeholder="Qty">
                        </div>

                        <div class="col-md-2">
                            <input type="number" id="itemPrice" class="form-control" placeholder="Price">
                        </div>

                        <div class="col-md-2">
                            <button id="addItemBtn" class="btn btn-primary w-100">
                                Add
                            </button>
                        </div>

                    </div>

                </div>

            </div>

            <!-- Shopping Cart -->
            <div class="card shadow-sm border-0 mb-4">

                <div class="card-body">

                    <h5>Shopping Cart</h5>

                    <table class="table table-hover align-middle">

                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="cartItems"></tbody>

                    </table>

                    <h5 class="text-end mt-3">
                        Grand Total:
                        <span id="grandTotal">₹0</span>
                    </h5>

                    <!-- Receipt Button -->
                    <div class="d-flex justify-content-end gap-2 mt-3">

    <button
        id="emptyCartBtn"
        class="btn btn-danger">

        <i class="bi bi-trash3-fill"></i>
        Empty Cart

    </button>

    <button
        id="receiptBtn"
        class="btn btn-success">

        <i class="bi bi-receipt"></i>
        View Receipt

    </button>

</div>

                </div>

            </div>

            <!-- Activity Log -->
            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <h5>Activity Log</h5>

                    <div id="activityLog"></div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="../js/room.js"></script>

</body>
</html>
